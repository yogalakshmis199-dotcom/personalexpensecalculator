<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Personal Expense Calculator</h1>

        <div class="form-section">

            <label>Monthly Income</label>
            <input type="number" id="income" placeholder="Enter your income">

            <h2>Add Expense</h2>

            <input type="text" id="expenseName" placeholder="Expense name">

            <input type="number" id="expenseAmount" placeholder="Expense amount">

            <select id="category">
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>

            <button onclick="addExpense()">Add Expense</button>

        </div>

        <div class="summary">

            <h2>Summary Report</h2>

            <p>Total Income: ₹<span id="totalIncome">0</span></p>

            <p>Total Expenses: ₹<span id="totalExpense">0</span></p>

            <p>Savings: ₹<span id="savings">0</span></p>

        </div>

        <div class="expense-list">

            <h2>Expense Details</h2>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Amount</th>
                        <th>Category</th>
                    </tr>
                </thead>

                <tbody id="expenseTable">
                </tbody>
            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
